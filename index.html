<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mix2list</title>

    <!-- ============================================================
         ADOBE FONTS (Helvetica Neue LT Pro) — kit pasted below.
         1. fonts.adobe.com → "Helvetica Neue LT Pro" added to a Web
            Project named e.g. "mix2list".
         2. The <link rel="stylesheet" href="https://use.typekit.net/XXXX.css">
            it gives you is pasted below.
         3. The CSS targets "helvetica-neue-lt-pro" as the first
            font-family, so once the kit loads it takes over
            automatically. Until then the Inter fallback stands in.
            Weights available: Ultra Light 100, Light 300, Roman 400,
            Medium 500, Bold 700 (no 600).
         ============================================================ -->
    <link rel="stylesheet" href="https://use.typekit.net/qqd0rcw.css">
    <!-- Fallback / stand-in faces (also provides JP + mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
