<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mix2list</title>

    <!-- ============================================================
         ADOBE FONTS (Helvetica Now) — paste your kit here.
         1. fonts.adobe.com → add "Helvetica Now Display" + "Helvetica
            Now Text" to a Web Project named e.g. "mix2list".
         2. Copy the <link rel="stylesheet" href="https://use.typekit.net/XXXX.css">
            it gives you and replace the placeholder line below.
         3. The CSS already targets "helvetica-now-display" /
            "helvetica-now-text" as the first font-family, so once the
            kit loads it takes over automatically. Until then the Inter
            fallback below stands in.
         ============================================================ -->
    <!-- <link rel="stylesheet" href="https://use.typekit.net/XXXXXXX.css"> -->

    <!-- Fallback / stand-in faces (also provides JP + mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
